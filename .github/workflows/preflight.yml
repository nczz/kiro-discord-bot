name: preflight

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:
    inputs:
      docker_build:
        description: "Build the Docker image during this manual run"
        required: false
        default: "false"
        type: choice
        options:
          - "false"
          - "true"

permissions:
  contents: read

concurrency:
  group: preflight-${{ github.ref }}
  cancel-in-progress: true

jobs:
  preflight:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: webshare-web/package-lock.json

      - name: Install WebShare dependencies
        working-directory: webshare-web
        run: npm ci

      - name: Run release preflight
        env:
          RUN_DOCKER_BUILD: ${{ github.event_name == 'workflow_dispatch' && inputs.docker_build || 'false' }}
          RUN_ACP_SMOKE: "0"
        run: scripts/release-preflight.sh
