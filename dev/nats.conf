# Development/internal-lightweight single-node NATS config for A2A rollout smokes.
# Hardened production may use NKey/JWT credentials or an HA JetStream cluster when availability requirements justify it.

port: 4222
server_name: kiro-a2a-dev

jetstream {
  store_dir: "./data/nats/jetstream"
  max_mem_store: 256MiB
  max_file_store: 2GiB
}

http: 8222
